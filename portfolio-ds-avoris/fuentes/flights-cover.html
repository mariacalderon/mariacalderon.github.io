<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 900px; height: 720px; background: transparent; overflow: hidden; }
  .stage { position: relative; width: 900px; height: 720px; }

  /* monitor */
  .monitor { position: absolute; left: 10px; top: 40px; width: 740px; }
  .bezel { background: #111; border-radius: 22px 22px 0 0; padding: 16px; }
  .desk { width: 708px; height: 442.5px; border-radius: 4px; background: url(flights-desktop.webp) no-repeat; background-size: 867.6px auto; background-position: -13px -73.7px; }
  .chin { height: 62px; border-radius: 0 0 22px 22px; background: linear-gradient(#E6E7E9, #C9CBCE); box-shadow: inset 0 1px 0 rgba(255,255,255,0.7); }
  .neck { margin: 0 auto; width: 150px; height: 110px; background: linear-gradient(90deg, #B9BBBF, #E4E5E7 45%, #C3C5C8); clip-path: polygon(10% 0, 90% 0, 100% 100%, 0 100%); }
  .base { margin: 0 auto; width: 240px; height: 14px; border-radius: 4px 4px 8px 8px; background: linear-gradient(#D9DADC, #AEB0B3); box-shadow: 0 10px 18px rgba(0,0,0,0.12); }

  /* phone */
  .phone { position: absolute; left: 640px; top: 200px; width: 236px; border-radius: 40px; background: #111; padding: 10px; box-shadow: 0 24px 50px rgba(0,0,0,0.25), inset 0 0 0 2px #2A2A2A; }
  .phone .screen { position: relative; border-radius: 31px; overflow: hidden; background: #fff; }
  .status { height: 30px; background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 22px 0 26px; font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 12px; font-weight: 600; color: #111; }
  .status span { display: flex; gap: 4px; align-items: center; }
  .status i { display: block; background: #111; border-radius: 2px; }
  .mob { position: relative; width: 216px; height: 449px; background: url(flights-mobile.webp) no-repeat; background-size: 888.9px auto; background-position: -336.4px -116.9px; }
  .patch { position: absolute; left: 166px; top: 339px; width: 40px; height: 42px; background: #fff; }
  .cam { position: absolute; top: 9px; left: 50%; transform: translateX(-50%); width: 11px; height: 11px; border-radius: 50%; background: #111; }
</style>
</head>
<body>
  <div class="stage">
    <div class="monitor">
      <div class="bezel"><div class="desk"></div></div>
      <div class="chin"></div>
      <div class="neck"></div>
      <div class="base"></div>
    </div>
    <div class="phone">
      <div class="screen">
        <div class="status">12:30<span><i style="width:3px;height:5px"></i><i style="width:3px;height:7px"></i><i style="width:3px;height:9px"></i><i style="width:18px;height:9px;border-radius:3px;margin-left:4px"></i></span></div>
        <div class="mob"><div class="patch"></div></div>
        <div class="cam"></div>
      </div>
    </div>
  </div>
</body>
</html>
