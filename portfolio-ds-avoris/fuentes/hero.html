<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  html, body { width: 1000px; height: 680px; background: #FFFCEB; padding: 0; overflow: hidden; }
  .stage { position: relative; width: 1000px; height: 680px; }
  .win { position: absolute; width: 660px; background: #fff; border-radius: 18px; overflow: hidden; box-shadow: 0 28px 70px rgba(5,48,61,0.18), 0 0 0 1px rgba(5,48,61,0.06); }
  .bar { display: flex; align-items: center; gap: 7px; padding: 11px 14px; border-bottom: 1px solid #F1F1F1; }
  .bar i { width: 10px; height: 10px; border-radius: 50%; background: #E3E3DF; display: block; }
  .url { margin-left: 10px; flex: 1; background: #F9F9F9; border-radius: 999px; padding: 5px 13px; font-size: 13px; font-weight: 600; color: #909090; }
  .win img { display: block; width: 100%; aspect-ratio: 2880 / 1560; object-fit: cover; object-position: top; }
  .w1 { left: 60px; top: 70px; transform: rotate(-4deg); }
  .w2 { left: 290px; top: 250px; transform: rotate(3deg); z-index: 2; }
</style>
</head>
<body>
  <div class="stage">
    <div class="win w1">
      <div class="bar"><i></i><i></i><i></i><div class="url">btravel.com</div></div>
      <img src="home-btravel.png">
    </div>
    <div class="win w2">
      <div class="bar"><i></i><i></i><i></i><div class="url">halconviajes.com</div></div>
      <img src="home-halcon.png">
    </div>
  </div>
</body>
</html>
