<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  .intro { font-size: 24px; color: var(--body); font-weight: 500; margin-top: 14px; }
  .grid { margin-top: 36px; display: grid; grid-template-columns: 1fr 330px; gap: 28px; align-items: start; }
  .panel { padding: 20px; }
  .panel .label { margin: 4px 4px 14px; }
  .desk { position: relative; width: 1090px; height: 616px; border-radius: 14px; background: url(flights-desktop.webp) no-repeat; background-size: 1090px auto; background-position: 0 -92.7px; box-shadow: 0 0 0 1px rgba(0,0,0,0.06); }
  .mob { position: relative; width: 290px; height: 603px; border-radius: 22px; background: url(flights-mobile.webp) no-repeat #fff; background-size: 1193.4px auto; background-position: -451.7px -156.9px; box-shadow: 0 0 0 1px rgba(0,0,0,0.06); }
  .patch { position: absolute; left: 228px; top: 461px; width: 54px; height: 54px; background: #fff; }
</style>
</head>
<body>
  <div class="eyebrow">The new results page</div>
  <div class="intro"><b>One clear price</b>, the cheapest combination as a suggestion, and outbound and return side by side.</div>
  <div class="grid">
    <div class="card panel"><div class="label">Desktop</div><div class="desk"><div class="patch" style="left:1026px; top:552px; width:50px; height:50px;"></div></div></div>
    <div class="card panel"><div class="label">Mobile</div><div class="mob"><div class="patch"></div></div></div>
  </div>
</body>
</html>
