<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  .intro { font-size: 24px; color: var(--body); font-weight: 500; margin-top: 14px; }
  .intro b { color: var(--black); }
  .grid { margin-top: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .win { background: #fff; border-radius: 22px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.07), 0 0 0 1px rgba(0,0,0,0.04); }
  .bar { display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--light); }
  .bar i { width: 12px; height: 12px; border-radius: 50%; background: #E3E3DF; display: block; }
  .url { margin-left: 14px; flex: 1; background: var(--bg); border-radius: 999px; padding: 7px 16px; font-size: 15px; font-weight: 600; color: var(--gray); }
  .win img { display: block; width: 100%; aspect-ratio: 2880 / 1560; object-fit: cover; object-position: top; }
  .brand { display: flex; align-items: center; gap: 12px; margin-top: 22px; font-size: 22px; font-weight: 700; }
  .brand span { width: 18px; height: 18px; border-radius: 50%; display: block; }
  .brand em { font-style: normal; font-size: 19px; font-weight: 500; color: var(--body); }
  .shared { margin-top: 36px; display: flex; align-items: center; gap: 18px; padding: 24px 32px; }
</style>
</head>
<body>
  <div class="eyebrow">Same idea, different brands</div>
  <div class="intro">Two brands of the group, <b>the same structure</b>: only the brand changes.</div>

  <div class="grid">
    <div>
      <div class="win">
        <div class="bar"><i></i><i></i><i></i><div class="url">btravel.com</div></div>
        <img src="home-btravel.png">
      </div>
      <div class="brand"><span style="background:#1f72db"></span>B travel <em>· blue, square corners, light type</em></div>
    </div>
    <div>
      <div class="win">
        <div class="bar"><i></i><i></i><i></i><div class="url">halconviajes.com</div></div>
        <img src="home-halcon.png">
      </div>
      <div class="brand"><span style="background:#d52620"></span>Halcón Viajes <em>· red, round corners, bold type</em></div>
    </div>
  </div>

  <div class="card shared">
    <div class="muted-label">Shared</div>
    <div class="chips">
      <span class="chip">Header and menu</span>
      <span class="chip">Search box</span>
      <span class="chip">Product tabs</span>
      <span class="chip">Form fields</span>
      <span class="chip">Main button</span>
    </div>
  </div>
</body>
</html>
